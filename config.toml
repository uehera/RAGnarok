[general]
app_name = "RAGnarok"
environment = "development"
log_level = "INFO"

[database]
db_path = "data/db/ragnarok.duckdb"
read_only = false
timeout_seconds = 30.0

[ingestion]
staging_directory = "data/staging"
raw_directory = "data/raw"
parsed_directory = "data/parsed"
supported_formats = [".pdf", ".docx", ".md", ".txt"]
batch_size = 50

[ingestion.deduplication]
hash_algorithm = "sha256"
reject_duplicates = true

[ingestion.parser]
engine = "pymupdf4llm"
export_format = "markdown"

[chunking]
strategy = "markdown_header_recursive"
parent_target_size = 2000
child_target_size = 500
child_overlap = 50
parent_overlap = 0
heading_levels = ["#", "##", "###"]
separators = ["\n\n", "\n", " ", ""]
size_counter = "transformers.AutoTokenizer"
fallback_counter = "tiktoken"
max_input_tokens = 8192

[embedding]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
vector_dimension = 384
batch_size = 100
similarity_metric = "cosine"

[dense_retrieval]
provider = "fastembed"
model = "BAAI/bge-small-en-v1.5"
vector_dimension = 384
batch_size = 100
similarity_metric = "cosine"

[lexical_retrieval]
library = "bm25s"
case = "lowercase"
stop_words_removed = true
stemming_enabled = true

[hybrid_retrieval]
k = 60

[hybrid_retrieval.reranker]
enabled = true
model = "ms-marco-MiniLM-L-12-v2"
top_n = 15
top_k = 10

[reranking]
enabled = true
model = "ms-marco-MiniLM-L-12-v2"
top_n = 15
top_k = 10

[context_management]
max_tokens = 4000

[query_rewriting]
enabled = false
model = "groq/qwen/qwen3.8-27b"

[adaptive_retrieval]
enabled = true
default_strategy = "hybrid"

[self_rag]
enabled = false
decision_method = "llm"
model = "groq/qwen/qwen3.8-27b"

[guardrails]
enabled = true
strict_mode = false
classifier_backend = "litellm"
prompt_injection_model = "ProtectAI/deberta-v3-base-prompt-injection-v2"
nli_grounding_model = "cross-encoder/nli-deberta-v3-base"
injection_threshold = 0.5
contradiction_threshold = 0.5
max_query_tokens = 1024
enable_pii_filter = true
enable_injection_detection = true
enable_grounding_check = false
enable_document_guard = true
document_injection_action = "quarantine" # "sanitize", "quarantine", or "reject"
quarantine_directory = "data/quarantine"
enable_context_screening = true
context_screening_action = "drop" # "drop", "quarantine", or "sanitize"
model = "groq/qwen/qwen3.8-27b"
timeout_seconds = 2.0

[evals]
framework = "deepeval"
judge_model = "gpt-4o"
golden_dataset_path = "tests/data/golden_dataset.json"

[evals.thresholds]
context_precision = 0.85
context_recall = 0.85
faithfulness = 0.90
answer_relevancy = 0.85

[generation]
model = "groq/qwen/qwen3.8-27b"
temperature = 0.1
max_tokens = 1500
stream = true
timeout_seconds = 15.0

[generation.fallbacks]
enabled = true
models = [
  "groq/openai/gpt-oss-120b",
  "groq/openai/gpt-oss-20b"
]

[generation.citations]
enabled = true
format = "bracketed"
show_provenance = true

[cli]
theme = "dark"
show_waterfall = true
show_provenance = true
