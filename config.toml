[general]
app_name = "RAGnarok"
environment = "development"
log_level = "INFO"

[database]
min_connections = 1
max_connections = 10
timeout_seconds = 30.0

[ingestion]
staging_directory = "data/staging"
raw_directory = "data/raw"
parsed_directory = "data/parsed"
supported_formats = [".pdf", ".docx", ".md", ".txt"]
batch_size = 50

[ingestion.deduplication]
hash_algorithm = "sha256"
reject_duplicates = true

[ingestion.parser]
engine = "docling"
export_format = "markdown"

[chunking]
strategy = "markdown_header_recursive"
parent_target_size = 2000
child_target_size = 500
child_overlap = 50
parent_overlap = 0
heading_levels = ["#", "##", "###"]
separators = ["\n\n", "\n", " ", ""]
size_counter = "transformers.AutoTokenizer"
fallback_counter = "tiktoken"
max_input_tokens = 8192

[embedding]
provider = "sentence-transformers"
model = "BAAI/bge-small-en-v1.5"
vector_dimension = 384
batch_size = 100
similarity_metric = "cosine"

[dense_retrieval]
provider = "sentence-transformers"
model = "BAAI/bge-small-en-v1.5"
vector_dimension = 384
batch_size = 100
similarity_metric = "cosine"

[lexical_retrieval]
library = "bm25s"
case = "lowercase"
stop_words_removed = true
stemming_enabled = true

[hybrid_retrieval]
k = 60

[hybrid_retrieval.reranker]
enabled = true
model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
top_n = 50
top_k = 10

[reranking]
enabled = true
model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
top_n = 50
top_k = 10

[context_management]
max_tokens = 4000

[query_rewriting]
enabled = true
model = "groq/openai/gpt-oss-20b"

[adaptive_retrieval]
enabled = true
default_strategy = "hybrid"

[self_rag]
enabled = true
decision_method = "llm"
model = "groq/openai/gpt-oss-20b"

[guardrails]
enabled = true
strict_mode = false
max_query_tokens = 1024
enable_pii_filter = true
enable_injection_detection = true
model = "groq/openai/gpt-oss-20b"

[evals]
framework = "deepeval"
judge_model = "gpt-4o"
golden_dataset_path = "tests/data/golden_dataset.json"

[evals.thresholds]
context_precision = 0.85
context_recall = 0.85
faithfulness = 0.90
answer_relevancy = 0.85

[generation]
model = "groq/openai/gpt-oss-20b"
temperature = 0.1
max_tokens = 1500
stream = true
timeout_seconds = 15.0

[generation.fallbacks]
enabled = true
models = [
  "groq/qwen/qwen3.8-27b",
  "groq/openai/gpt-oss-120b"
]

[generation.citations]
enabled = true
format = "bracketed"
show_provenance = true

[cli]
theme = "dark"
show_waterfall = true
show_provenance = true
