name: RAGnarok CI/CD & Quality Gate Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Hygiene & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: uv sync --all-extras --dev

      - name: Lint Verification (Ruff)
        run: uv run ruff check .

      - name: Static Type Analysis (Pyright)
        run: uv run pyright

  test-and-eval:
    name: Continuous Evaluation & Battle Testing
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragnarok
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragnarok
      DEEPEVAL_TELEMETRY_OPT_OUT: "Y"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: uv sync --all-extras --dev

      - name: Initialize PostgreSQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d ragnarok -f scripts/init_schema.sql

      - name: Execute Full Test Suite (Unit, Integration & Battle Dimensions)
        run: uv run pytest tests/unit tests/integration tests/battle -v

      - name: Execute Continuous Evaluation Benchmark (Golden Dataset & Evaluation Triad)
        run: uv run pytest tests/evals/test_golden_dataset.py -v -s
